apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-operator-spark
  namespace: recovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: recovery
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - configmaps
      - persistentvolumeclaims
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
      - deletecollection
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: recovery
subjects:
  - kind: ServiceAccount
    name: spark-operator-spark
    namespace: recovery
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
