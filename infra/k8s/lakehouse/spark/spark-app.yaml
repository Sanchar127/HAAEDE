apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: kafka-to-iceberg
  namespace: default

spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  image: kafka-iceberg-spark:1.0
  imagePullPolicy: IfNotPresent
  sparkVersion: "3.5.0"

  
  mainApplicationFile: local:///opt/spark/jobs/streaming/kafka_to_iceberg.py
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 20

  sparkConf:

    # =====================================================
    # KAFKA
    # =====================================================
    "spark.kafka.bootstrap.servers": "recovery-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
    "spark.sql.streaming.kafka.useDeprecatedOffsetFetching": "false"
    "spark.kafka.consumer.security.protocol": "PLAINTEXT"
    "spark.kafka.consumer.session.timeout.ms": "30000"
    "spark.kafka.consumer.request.timeout.ms": "40000"
    "spark.kafka.consumer.retries": "10"

    # =====================================================
    # ICEBERG
    # =====================================================
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.local": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.local.type": "hadoop"
    "spark.sql.catalog.local.warehouse": "s3a://warehouse/"
    "spark.sql.catalog.local.io-impl": "org.apache.iceberg.hadoop.HadoopFileIO"

    # =====================================================
    # MINIO / S3A
    # =====================================================
    "spark.hadoop.fs.s3a.endpoint": "http://minio.lakehouse.svc.cluster.local:9000"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "false"
    "spark.hadoop.fs.s3a.access.key": "minio"
    "spark.hadoop.fs.s3a.secret.key": "minio123"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"

    # =====================================================
    # PYSPARK
    # =====================================================
    "spark.pyspark.python": "python3"
    "spark.pyspark.driver.python": "python3"

    # =====================================================
    # PERFORMANCE
    # =====================================================
    "spark.sql.shuffle.partitions": "2"
    "spark.default.parallelism": "2"
    "spark.driver.memoryOverhead": "512m"
    "spark.executor.memoryOverhead": "512m"

    # =====================================================
    # STABILITY
    # =====================================================
    "spark.network.timeout": "300s"
    "spark.executor.heartbeatInterval": "60s"
    "spark.kubernetes.file.upload.path": "/tmp"
    "spark.jars.ivy": "/tmp/.ivy2"

    # =====================================================
    # CLASS PATH (from image jars)
    # =====================================================
    "spark.driver.extraClassPath": "/opt/spark/custom-jars/*"
    "spark.executor.extraClassPath": "/opt/spark/custom-jars/*"

  

  driver:
    serviceAccount: spark
    cores: 1
    coreLimit: "1200m"
    memory: "1g"

  executor:
    instances: 1
    cores: 1
    coreLimit: "1200m"
    memory: "1g"