apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: iceberg-query-debug
  namespace: spark
  labels:
    app.kubernetes.io/name: iceberg-query-debug
    app.kubernetes.io/component: spark-job

spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  image: kafka-iceberg-spark:1.0
  imagePullPolicy: IfNotPresent

  sparkVersion: "3.5.0"

  mainApplicationFile: local:///opt/spark/jobs/debug_iceberg_query.py

  restartPolicy:
    type: Never

  sparkConf:

    # ------------------------------------------------------------------
    # Iceberg
    # ------------------------------------------------------------------

    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

    # Production catalog:
    # Spark -> Polaris REST Catalog -> PostgreSQL / MinIO
    spark.sql.catalog.polaris: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.polaris.type: rest
    spark.sql.catalog.polaris.uri: http://polaris.polaris.svc.cluster.local:8181/api/catalog

    # Polaris catalog/warehouse name.
    spark.sql.catalog.polaris.warehouse: warehouse

    # ------------------------------------------------------------------
    # Polaris authentication
    # ------------------------------------------------------------------

    spark.sql.catalog.polaris.oauth2-server-uri: http://polaris.polaris.svc.cluster.local:8181/api/catalog/v1/oauth/tokens

    spark.sql.catalog.polaris.credential: ${POLARIS_CLIENT_ID}:${POLARIS_CLIENT_SECRET}

    spark.sql.catalog.polaris.scope: PRINCIPAL_ROLE:ALL

    spark.sql.catalog.polaris.token-refresh-enabled: "true"

    # ------------------------------------------------------------------
    # Iceberg / AWS bundle
    # ------------------------------------------------------------------

    spark.driver.extraClassPath: /opt/spark/custom-jars/*
    spark.executor.extraClassPath: /opt/spark/custom-jars/*

    # ------------------------------------------------------------------
    # MinIO / S3A
    #
    # These are retained for Spark operations that use Hadoop's S3A
    # filesystem directly.
    # ------------------------------------------------------------------

    spark.hadoop.fs.s3a.endpoint: http://minio.lakehouse.svc.cluster.local:9000
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.access.key: minio
    spark.hadoop.fs.s3a.secret.key: minio123
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem

    # ------------------------------------------------------------------
    # Performance / reliability
    # ------------------------------------------------------------------

    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"

    spark.network.timeout: "120s"
    spark.executor.heartbeatInterval: "30s"

  driver:

    serviceAccount: spark-operator-spark

    cores: 1
    coreLimit: "2"

    memory: "1g"
    memoryOverhead: "384m"

    env:
      - name: POLARIS_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: polaris-spark-client
            key: client-id

      - name: POLARIS_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: polaris-spark-client
            key: client-secret

  executor:

    instances: 1

    cores: 1
    coreLimit: "2"

    memory: "1g"
    memoryOverhead: "384m"

    env:
      - name: POLARIS_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: polaris-spark-client
            key: client-id

      - name: POLARIS_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: polaris-spark-client
            key: client-secret