apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: iceberg-query-debug
  namespace: spark

spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  image: kafka-iceberg-spark:1.0
  sparkVersion: "3.5.0"

  mainApplicationFile: local:///opt/spark/jobs/debug_iceberg_query.py

  restartPolicy:
    type: Never

  sparkConf:
    # Iceberg Spark integration
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

    spark.sql.catalog.local: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.local.type: hadoop
    spark.sql.catalog.local.warehouse: s3a://warehouse/
    spark.sql.catalog.local.io-impl: org.apache.iceberg.hadoop.HadoopFileIO

    # Make Iceberg, Kafka, Hadoop AWS, and S3A JARs available
    # to both the Spark driver and executor.
    spark.driver.extraClassPath: /opt/spark/custom-jars/*
    spark.executor.extraClassPath: /opt/spark/custom-jars/*

    # MinIO / S3A configuration
    spark.hadoop.fs.s3a.endpoint: http://minio.lakehouse.svc.cluster.local:9000
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.access.key: minio
    spark.hadoop.fs.s3a.secret.key: minio123
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem

  driver:
    serviceAccount: spark-operator-spark
    cores: 1
    memory: "1g"

  executor:
    instances: 1
    cores: 1
    memory: "1g"