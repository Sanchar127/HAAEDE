apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://your-git-repo
    targetRevision: main
    path: infra/k8s/lakehouse/minio

  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true