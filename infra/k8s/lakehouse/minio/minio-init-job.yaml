apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: lakehouse
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 minio minio123; do
                echo "waiting for minio..."
                sleep 5
              done

              mc mb -p local/warehouse || echo "bucket already exists"
              mc ls local