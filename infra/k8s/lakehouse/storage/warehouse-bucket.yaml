apiVersion: batch/v1
kind: Job
metadata:
  name: create-warehouse-bucket
  namespace: lakehouse
spec:
  template:
    spec:
      containers:
        - name: mc
          image: minio/mc
          command: ["/bin/sh", "-c"]
          args:
            - |
              mc alias set local http://minio:9000 minio minio123;
              mc mb local/warehouse || true;
      restartPolicy: OnFailure