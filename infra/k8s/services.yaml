apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: recovery
spec:
  selector:
    app: ingestion-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: recovery
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: recovery
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
