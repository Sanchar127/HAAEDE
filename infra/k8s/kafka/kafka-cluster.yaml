apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: recovery-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    # In Kafka 4.x metadata version is usually handled automatically, 
    # but we define the listeners clearly for your ingestion service.
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # KRaft specific setting
      process.roles: "broker,controller" 

  entityOperator:
    topicOperator: {}
    userOperator: {}