apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: recovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
    spec:
      containers:
        - name: ingestion
          image: sanchar127/ingestion-service:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app

          ports:
            - containerPort: 8001   # 🔥 IMPORTANT (metrics port)

          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "recovery-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: TOPIC_NAME
              value: "fintech.debt.raw"
            - name: PYTHONPATH
              value: "/app"