apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-consumer
  namespace: recovery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-consumer
  template:
    metadata:
      labels:
        app: ingestion-consumer
    spec:
      containers:
        - name: consumer
          image: your-dockerhub/recovery-api:latest
          command: ["python", "app/consumer/worker.py"]
          envFrom:
            - configMapRef:
                name: recovery-config
            - secretRef:
                name: recovery-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "600m"
              memory: "512Mi"
