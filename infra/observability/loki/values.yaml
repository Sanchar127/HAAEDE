deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
  storage_config:
    aws:
      endpoint: http://minio.lakehouse.svc.cluster.local:9000
      access_key_id: minio
      secret_access_key: minio123
      s3forcepathstyle: true
      insecure: true

singleBinary:
  replicas: 1

persistence:
  enabled: true
  size: 10Gi