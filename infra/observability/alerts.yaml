apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: recovery
data:
  alerts.yml: |
    groups:
      - name: recovery-alerts
        rules:
          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total[1m]) > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"

          - alert: APIUnavailable
            expr: up{job="fastapi"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "FastAPI service is down"

          - alert: KafkaConsumerLag
            expr: kafka_consumergroup_lag > 1000
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High Kafka consumer lag"
