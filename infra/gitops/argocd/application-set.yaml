apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-stack
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          # ─────────────────────────────────────────────────────
          # Prometheus (kube-prometheus-stack wrapper)
          # ─────────────────────────────────────────────────────
          - app: prometheus
            # Path to wrapper chart in YOUR Git repo (relative to repo root)
            gitPath: observability/prometheus
            # ⚠️ REPLACE with your actual Git repo URL (SSH or HTTPS)
            repoURL: https://github.com/Sanchar127/HAAEDE.git
            targetRevision: sanchar-dev
            namespace: observability
            # Chart name inside the wrapper's Chart.yaml dependencies
            upstreamChart: kube-prometheus-stack

          # ─────────────────────────────────────────────────────
          # Grafana
          # ─────────────────────────────────────────────────────
          - app: grafana
            gitPath: observability/grafana
            repoURL: https://github.com/Sanchar127/HAAEDE.git
            targetRevision: HEAD
            namespace: observability
            upstreamChart: grafana

          # ─────────────────────────────────────────────────────
          # Loki
          # ─────────────────────────────────────────────────────
          - app: loki
            gitPath: observability/loki
            repoURL: https://github.com/Sanchar127/HAAEDE.git
            targetRevision: HEAD
            namespace: observability
            upstreamChart: loki

          # ─────────────────────────────────────────────────────
          # Tempo
          # ─────────────────────────────────────────────────────
          - app: tempo
            gitPath: observability/tempo
            repoURL: https://github.com/Sanchar127/HAAEDE.git
            targetRevision: HEAD
            namespace: observability
            upstreamChart: tempo

  template:
    metadata:
      name: "{{app}}"
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: argocd
        observability.component: "{{app}}"
    spec:
      project: default

      # ✅ Source points to YOUR Git repo, not external Helm repos
      source:
        repoURL: "{{repoURL}}"
        path: "{{gitPath}}"          # e.g., observability/prometheus
        targetRevision: "{{targetRevision}}"
        helm:
          # ✅ values.yaml is now resolved relative to `path`
          valueFiles:
            - values.yaml
          # Optional: pass app name as Helm value for templating
          parameters:
            - name: global.appName
              value: "{{app}}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - Validate=false           # Skip strict validation if CRDs are delayed
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      # ✅ Ignore differences that cause false "OutOfSync" on stateful apps
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/replicas
            - /spec/revisionHistoryLimit
        - group: ""
          kind: ConfigMap
          jsonPointers:
            - /data/grafana\.ini   # Grafana may auto-generate config