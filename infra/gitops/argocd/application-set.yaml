apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-stack
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - app: prometheus
            chart: kube-prometheus-stack
            repoURL: https://prometheus-community.github.io/helm-charts
            targetRevision: 58.0.0
            namespace: observability
            valuesPath: observability/prometheus/values.yaml

          - app: grafana
            chart: grafana
            repoURL: https://grafana.github.io/helm-charts
            targetRevision: 7.3.7
            namespace: observability
            valuesPath: observability/grafana/values.yaml

          - app: loki
            chart: loki
            repoURL: https://grafana.github.io/helm-charts
            targetRevision: 6.25.0
            namespace: observability
            valuesPath: observability/loki/values.yaml

          - app: tempo
            chart: tempo
            repoURL: https://grafana.github.io/helm-charts
            targetRevision: 1.10.1
            namespace: observability
            valuesPath: observability/tempo/values.yaml

  template:
    metadata:
      name: "{{app}}"
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: "{{repoURL}}"
        chart: "{{chart}}"
        targetRevision: "{{targetRevision}}"
        helm:
          valueFiles:
            - "{{valuesPath}}"   # ← Dynamic path to your values file
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true   # Helps with CRDs and complex resources