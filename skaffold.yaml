apiVersion: skaffold/v4beta7
kind: Config

build:
  local:
    push: false
  artifacts:
    - image: ingestion-service
      context: .
      docker:
        dockerfile: infra/docker/ingestion/Dockerfile

manifests:
  rawYaml:
    - infra/k8s/base/configmap.yaml
    - infra/k8s/base/secrets.yaml
    - infra/k8s/apps/*.yaml

deploy:
  kubectl: {}

portForward:
  - resourceType: deployment
    resourceName: ingestion
    namespace: recovery
    port: 8080
    localPort: 8080